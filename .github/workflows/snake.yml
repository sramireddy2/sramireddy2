# Redraws the contribution-graph snake shown in README.md once a day.
# The SVGs are pushed to the `output` branch, which the README links to.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7F5AF0&color_dots=#ebedf0,#c7f0f2,#7fd6dc,#2cb1bc,#1a7f87
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F25F4C&color_dots=#161b22,#3b2a6b,#5b3fb0,#7f5af0,#b49cff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
